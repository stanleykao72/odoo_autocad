[pytest]
testpaths = tests

# 預設不執行需要「真的有 AutoCAD 在跑」的 live 測試。
# 這些測試的結果會隨 AutoCAD 當下的狀態改變（忙碌時被 skip、可連線時真的操作圖面），
# 讓預設的 pytest tests/ 變得不可重現。需要時明確指定 marker：
#
#   pytest tests/integration -m autocad          # 需 Full AutoCAD + 已開啟圖檔
#   pytest tests/integration -m ipc              # 需 AutoCAD LT/Full + McpDispatch.vlx
#   pytest tests/integration -m "autocad or ipc" # 兩者
addopts = -m "not autocad and not ipc"

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    autocad: marks tests requiring live AutoCAD COM connection
    ipc: marks tests requiring live AutoCAD IPC connection
    odoo: marks tests as Odoo-related
    mcp: marks tests as MCP-related
    integration: marks tests as integration tests
    unit: marks tests as unit tests
